name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Run tests
        run: |
          xcodebuild test -scheme ColimaUI \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -only-testing:ColimaUITests \
            CODE_SIGN_IDENTITY="-" \
            MACOSX_DEPLOYMENT_TARGET=14.0

      - name: Build ColimaUI
        run: |
          xcodebuild -scheme ColimaUI \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            clean build

      - name: Create DMG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APP_PATH="build/Build/Products/Release/ColimaUI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App not found at $APP_PATH"
            exit 1
          fi
          hdiutil create -volname "ColimaUI" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "ColimaUI-${TAG_NAME}.dmg"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "ColimaUI-${{ github.ref_name }}.dmg"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
